<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
</head>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function ChatInput(){
            return (
                <>
                    <input placeholder="Send a message to Chatbot" size="30"/>
                    <button>Send</button>
                </>
            );
        }

        function ChatMessage(props){
            const message = props.message
            return (
                <div>
                    {message}
                    <img src="user.png" width="50"/>
                </div>
            );
        }

        const app = (
            <>
                <ChatInput />
                <ChatMessage message="hello chatgpt"/>
                <ChatMessage message="Hello! how can I help you?"/>
                <ChatMessage message="can you get me todays date"/>
                <ChatMessage message="Today is September 27"/>
            </>
        );
 
        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(app);
    </script>
  </body>
</html>
