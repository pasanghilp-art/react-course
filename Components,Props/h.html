<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Basics</title>
</head>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
       function ProductsDetails(
        {
        productName,
        productPrice,
        productDiscount
       }
    ){
         return (
            <>
                <p>{productName}</p>
                {productDiscount && (
                    <>
                    <p><del>price: ${productPrice}</del></p>
                    <p>
                        Discount price:${productDiscount}
                    </p>
                    </>
                )}
                <button>Add to Cart</button>
            </>
         );
       }

       function App(){
            return ( 
            <>
                <ProductsDetails 
                productName="Cotton socks"
                productPrice="10.90"
                productDiscount="5.45"
                />

                <ProductsDetails
                productName="Tennis balls"
                productPrice="6.00"
                />

                <ProductsDetails
                productName="Plain T-Shirt"
                productPrice="7.99"
                />
            </>
            );
       }

        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container);root.render(<App/>);
    </script>
  </body>
</html>
