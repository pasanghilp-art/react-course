<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>React Basics</title>
</head>
    <body>
        <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
       function ProductsDetails(
        {
        productName,
        productPrice,
        productDiscount,
        imageSrc
       }
    ){
         return (
            <div>
                <img src={imageSrc} width="150"/>

                <p>{productName}</p>

                {productDiscount? 
                (
                    <>
                    <del>Price: ${productPrice}</del>
                    <p>Discount price:${productDiscount}</p> 
                    </> 
                ):(
                    <p>Price: ${productPrice}</p>
                )
            }
                <button>Add to Cart</button>
            </div>
         );
       }

       function App(){
            return ( 
            <>
                <ProductsDetails 
                productName="Cotton socks"
                productPrice="10.90"
                productDiscount="5.45"
                imageSrc="cotton-socks.png"
                />

                <ProductsDetails
                productName="Tennis balls"
                productPrice="6.00"
                imageSrc="plain-t-shirt.png"
                />

                <ProductsDetails
                productName="Plain T-Shirt"
                productPrice="7.99"
                imageSrc="tennis-balls.png"
                />
            </>
            );
       }

        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container);root.render(<App/>);
    </script>
  </body>
</html>
